name: MND Instagram Auto Post (停止中)
# 2026-07-09 停止。note連動の新システム shiojima-test/schoomy-note-queue の
# .github/workflows/ig-post.yml に一本化した。二重投稿を防ぐため cron を無効化している。
# 再開する場合は下の schedule のコメントを外す（新システムのcronを止めてから行うこと）。
on:
  # schedule:
  #   - cron: '0 0 * * *'   # 毎日 00:00 UTC = JST 09:00
  workflow_dispatch:
    inputs:
      test_now:
        description: 'true にすると、日付に関係なく未投稿の先頭1件を即投稿（テスト用）'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TEST_NOW: ${{ github.event.inputs.test_now }}
        run: python mnd/post_instagram.py
      - name: Commit status updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mnd/schedule_*.json
          git commit -m "mnd: update post status [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
