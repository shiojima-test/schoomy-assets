name: MND Instagram Auto Post
on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 00:00 UTC = JST 09:00
  workflow_dispatch: {}    # 手動テスト実行用
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Post due items to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python mnd/post_instagram.py
      - name: Commit status updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mnd/schedule_*.json
          git commit -m "mnd: update post status [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
